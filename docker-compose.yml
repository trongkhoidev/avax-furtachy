services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: futara
      POSTGRES_PASSWORD: futara
      POSTGRES_DB: futara
    ports:
      - "5432:5432"
    volumes:
      - futara-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futara -d futara"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  futara-postgres:
